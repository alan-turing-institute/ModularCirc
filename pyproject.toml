[build-system]
requires = ["setuptools >= 77.0.3", "wheel", "cython>=3.0", "numpy>=1.20"]
build-backend = "setuptools.build_meta"

[project]
name = "ModularCirc"
version = "0.3.0"
authors = [
    {name = "Maximilian Balmus", email = "mbalmus@turing.ac.uk"}
]
description = "A python package for creating and running 0D models of the cardiovascular system"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "matplotlib",
    "numba",
    "numpy",
    "pandas",
    "scipy",
    "joblib",
    "pandera",
    "tqdm",
    "setuptools"
]

[project.optional-dependencies]
notebooks = ["ipykernel"]
dev = ["pre-commit", "black", "flake8", "isort"]
performance = ["cython>=3.0"]

[project.urls]
"Homepage" = "https://github.com/alan-turing-institute/ModularCirc"
"Source Code" = "https://github.com/alan-turing-institute/ModularCirc"
"Bug Tracker" = "https://github.com/alan-turing-institute/ModularCirc/issues"

[tool.setuptools]
package-dir = {"" = "src"}
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ModularCirc.HelperRoutines" = ["*.pyx", "*.so", "*.pyd"]

[tool.cython]
# Cython compiler directives
language_level = "3"
boundscheck = false
wraparound = false
cdivision = true
initializedcheck = false
nonecheck = false
annotate = true
